# ranker.flisk.si on Cloudflare: products and repos ranked by what happened on GitHub, with a live README badge.
# Deploy by hand from this folder: bunx wrangler@4 deploy.
# Before the first deploy: bunx wrangler@4 d1 create flisk-ranker, paste the database_id below,
# then bunx wrangler@4 d1 execute flisk-ranker --remote --file schema.sql.
# Optional secret: GITHUB_TOKEN (raises the GitHub API limit from 60 to 5000 calls an hour).
name = "flisk-ranker"
main = "src/index.js"
compatibility_date = "2026-11-01"

[vars]
SUBMITS_PER_DAY = "100"

[[d1_databases]]
binding = "DB"
database_name = "flisk-ranker"
database_id = "REPLACE_AFTER_d1_create"

[triggers]
crons = ["7 * * * *"]

# Add once the database exists and the domain is agreed:
# [[routes]]
# pattern = "ranker.flisk.si"
# custom_domain = true
