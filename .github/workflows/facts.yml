name: Git stats
on:
  schedule:
    - cron: '37 */6 * * *'
  workflow_dispatch:
jobs:
  facts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun scripts/ci-facts.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INGEST_KEY: ${{ secrets.INGEST_KEY }}
