name: Star snapshot
on:
  schedule:
    - cron: '7 */3 * * *'
  workflow_dispatch:
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun scripts/ci-snapshot.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INGEST_KEY: ${{ secrets.INGEST_KEY }}
